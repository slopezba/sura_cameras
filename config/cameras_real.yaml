down_camera:
  device: /dev/video4
  camera_name: down_camera
  frame_id: sura/camera_down/optical_frame

  image_topic: /sura/down_camera/camera/image_raw
  camera_info_topic: /sura/down_camera/camera/camera_info
  rectified_topic: /sura/down_camera/camera/image_rect

  decimated_topic: /sura/down_camera/decimated/image_raw
  decimated_camera_info_topic: /sura/down_camera/decimated/camera_info

  decimation_x: 2
  decimation_y: 2
  offset_x: 0
  offset_y: 0

  width: 640
  height: 360
  framerate: 10.0
  pixel_format: mjpeg2rgb
  io_method: mmap


front_camera:
  driver: usb_cam
  device: /dev/video8
  camera_name: front_camera
  frame_id: sura/camera_front/optical_frame

  image_topic: /sura/front_camera/camera/image_raw
  camera_info_topic: /sura/front_camera/camera/camera_info
  rectified_topic: /sura/front_camera/camera/image_rect

  decimated_topic: /sura/front_camera/decimated/image_raw
  decimated_camera_info_topic: /sura/front_camera/decimated/camera_info

  decimation_x: 2
  decimation_y: 2
  offset_x: 0
  offset_y: 0

  width: 640
  height: 360
  framerate: 15.0
  pixel_format: mjpeg2rgb
  io_method: mmap


